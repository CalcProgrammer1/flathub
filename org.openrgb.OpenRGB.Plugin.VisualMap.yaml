id: org.openrgb.OpenRGB.Plugin.VisualMap
branch: '5'
extension-tag: org.openrgb.OpenRGB.Plugin
build-extension: true
separate-locales: false

runtime: org.openrgb.OpenRGB
runtime-version: 'stable'
sdk: org.kde.Sdk//6.10

build-options:
  prefix: /app/lib/openrgb/plugins/VisualMap

modules:
  - name: openrgb-plugin-visual-map
    buildsystem: qmake
    cleanup:
      - ${FLATPAK_DEST}/lib
    post-install:
      - mv ${FLATPAK_DEST}/lib/openrgb/plugins/libOpenRGBVisualMapPlugin.so ${FLATPAK_DEST}/libOpenRGBVisualMapPlugin.so
      - install -Dm644 images/OpenRGBVisualMapPlugin.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/openrgb-visual-map-plugin.png
    sources:
      - type: git
        url: https://gitlab.com/OpenRGBDevelopers/OpenRGBVisualMapPlugin
        tag: release_1.0
        commit: 1dde279ef57df315927e3c32aa7e0ad8bf9e39f8
