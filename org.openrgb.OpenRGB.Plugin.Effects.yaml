id: org.openrgb.OpenRGB.Plugin.Effects
branch: '5'
extension-tag: org.openrgb.OpenRGB.Plugin
build-extension: true
separate-locales: false

runtime: org.openrgb.OpenRGB
runtime-version: 'stable'
sdk: org.kde.Sdk//6.10

build-options:
  prefix: /app/lib/openrgb/plugins/Effects

modules:
  - name: openrgb-plugin-effects
    buildsystem: qmake
    cleanup:
      - ${FLATPAK_DEST}/lib
    post-install:
      - mv ${FLATPAK_DEST}/lib/openrgb/plugins/libOpenRGBEffectsPlugin.so ${FLATPAK_DEST}/libOpenRGBEffectsPlugin.so
      - install -Dm644 OpenRGBEffectsPlugin.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/openrgb-effects-plugin.png
    sources:
      - type: git
        url: https://gitlab.com/OpenRGBDevelopers/OpenRGBEffectsPlugin
        tag: release_1.0
        commit: 0e0f1b4708c302bad4270ab62349b2efe5dcc439

